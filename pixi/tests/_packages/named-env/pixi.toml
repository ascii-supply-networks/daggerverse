[workspace]
name = "named-env"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
requires-pixi = ">=0.70.0"

[dependencies]
python = "3.13.*"

[feature.dev.dependencies]
python = "3.13.*"
pytest = ">=9.0.3,<10"

[environments]
dev = { features = ["dev"], no-default-feature = true }

[tasks]
hello = "python -c \"print('named-env')\""
