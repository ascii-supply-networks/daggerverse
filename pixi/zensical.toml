[project]
site_name = "pixi - Dagger module"
site_description = "A Dagger module for Pixi-managed Python projects and workspaces."
site_author = "ascii-supply-networks"
repo_url = "https://github.com/ascii-supply-networks/daggerverse"
repo_name = "ascii-supply-networks/daggerverse"
edit_uri = "edit/main/pixi/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright &copy; 2026 ascii-supply-networks"
nav = [
  { "Overview" = "index.md" },
  { "Building containers" = "building.md" },
  { "Environments and features" = "environments.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "lucide/blocks"
link = "https://daggerverse.dev/mod/github.com/ascii-supply-networks/daggerverse/pixi"
name = "Daggerverse (SDK reference)"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.toc]
permalink = true
