[project]
name = "pixi"
version = "0.1.0"
description = "Dagger module for Pixi workspaces"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "anyio",
    "dagger-io",
    "opentelemetry-api",
    "packaging>=26.2",
]

# Map distributions to the import packages they ship, so deptry doesn't flag
# those imports as missing/unused.
[tool.deptry.package_module_name_map]
dagger-io = "dagger"
opentelemetry-api = "opentelemetry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64", "win-arm64"]
requires-pixi = ">=0.70.0"

[tool.pixi.dependencies]
python = ">=3.13,<3.15"
pytest = ">=9.1.1,<10"

[tool.pixi.pypi-dependencies]
pixi = { path = ".", editable = true }
dagger-io = ">=0.21.11,<0.22"
packaging = ">=26.2"
ruff = ">=0.17.2,<0.18"

[tool.pixi.tasks]
test = "python -m pytest -q"
lint = "ruff check ."
