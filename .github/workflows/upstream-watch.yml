name: Upstream Watch

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  PIXI_VERSION: "latest"

jobs:
  upstream-watch:
    name: upstream watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          frozen: true
          cache: false

      - name: Check upstream daggerverse updates
        run: |
          pixi run --frozen python scripts/check_upstream_updates.py \
            --config .github/upstream-watch.json \
            --output upstream-watch.md \
            --update-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
