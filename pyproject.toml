[project]
name = "ascii-daggerverse"
version = "0.1.0"
description = "ASCII Daggerverse modules"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".dagger/sdk",
    ".pixi",
    ".venv",
    "build",
    "dist",
    "pixi/site",
    "sdk",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"pixi/src/pixi/args.py" = ["UP040"]

[tool.ruff.lint.isort]
known-first-party = ["ascii_daggerverse", "pixi"]

[tool.pixi.workspace]
name = "daggerverse"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64", "win-arm64"]
requires-pixi = ">=0.70.0"

[tool.pixi.dependencies]
python = ">=3.13,<3.15"
pytest = ">=9.0.3,<10"
packaging = ">=26.2,<27"
pyyaml = ">=6.0.3,<7"

[tool.pixi.pypi-dependencies]
dagger-io = ">=0.18.19"
zensical = ">=0.0.44"
ruff = ">=0.14.8,<0.15"

[tool.pixi.feature.secops-audit.dependencies]
python = ">=3.13,<3.15"
pyyaml = ">=6.0.3,<7"
packaging = ">=26.2,<27"
filelock = ">=3.20.0,<4"

[tool.pixi.feature.secops-audit.pypi-dependencies]
pip-audit = ">=2.10.0,<3"

[tool.pixi.feature.pre-commit]
# `prek` is not available for conda-forge `win-arm64` yet.
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[tool.pixi.feature.pre-commit.dependencies]
prek = ">=0.4.4,<0.5"
ruff = ">=0.14.8,<0.15"
pinact = ">=4.0.0,<5"
zizmor = ">=1.25.2,<2"

[tool.pixi.environments]
secops-audit = { features = ["secops-audit"], no-default-feature = true, solve-group = "secops-audit" }
pre-commit = { features = ["pre-commit"], no-default-feature = true, solve-group = "pre-commit" }

[tool.pixi.tasks]
test = { cmd = "python -m pytest -q pixi/tests", env = { PYTHONPATH = "pixi/src" } }
lint = "ruff check ."
format-check = "ruff format --check ."
audit-pypi = "pixi run -e secops-audit --frozen python scripts/audit_pypi_from_pixi_lock.py"
upstream-watch = "python scripts/check_upstream_updates.py --config .github/upstream-watch.json"
dagger = "python scripts/run_dagger.py"
dagger-check = "python scripts/run_dagger.py check"
pre-commit-install = "pixi run -e pre-commit --frozen prek install"
pre-commit-run = "pixi run -e pre-commit --frozen prek"
pre-commit-run-all = "pixi run -e pre-commit --frozen prek run --all-files"
pin-actions = "pixi run -e pre-commit --frozen pinact run --fix=false --no-api"
audit-github-actions = "pixi run -e pre-commit --frozen zizmor --offline .github"
